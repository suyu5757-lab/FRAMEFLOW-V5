<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11110f" />
  <meta name="description" content="FRAMEFLOW 本地优先 AI 视频制作工作台，覆盖分镜、资产、镜头、配音配乐、生成与质检交付。" />
  <title>FRAMEFLOW · 个人 AI 视频工作台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23d7ff4b%22/><text x=%2232%22 y=%2245%22 text-anchor=%22middle%22 font-size=%2242%22 font-family=%22serif%22 font-weight=%22900%22 fill=%22%2311150a%22>F</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">F</div>
        <div><strong>FRAMEFLOW</strong><span>AI VIDEO OS</span></div>
      </div>
      <button class="new-project" id="newProjectBtn"><span>＋</span> 新建项目</button>
      <nav id="mainNav" aria-label="主导航">
        <button class="nav-item active" data-view="overview"><span>◫</span> 总览</button>
        <p>前期</p>
        <button class="nav-item" data-view="story"><span>✦</span> 故事与分镜</button>
        <button class="nav-item" data-view="assets"><span>◇</span> 资产工坊 <i id="assetBadge">5</i></button>
        <p>制作</p>
        <button class="nav-item" data-view="shots"><span>▦</span> 镜头导演</button>
        <button class="nav-item" data-view="audio"><span>◉</span> 配音与声音 <i id="audioBadge">0</i></button>
        <button class="nav-item" data-view="generate"><span>▶</span> 生成工作台</button>
        <p>后期</p>
        <button class="nav-item" data-view="review"><span>✓</span> 质检与交付</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" id="exportBtn"><span>⇩</span> 导出项目</button>
        <button class="nav-item" id="settingsBtn"><span>⚙</span> 工作台设置</button>
        <div class="profile"><div class="avatar">导</div><div><strong>我的导演台</strong><span>本地工作区</span></div><b>•••</b></div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="project-switcher"><span class="project-dot"></span><select id="projectSelect" aria-label="选择项目"></select><span class="save-state" id="saveState">已自动保存</span></div>
        <div class="top-actions">
          <label class="search"><span>⌕</span><input id="globalSearch" placeholder="搜索镜头、资产或任务" /></label>
          <button class="icon-btn" id="focusBtn" title="专注模式">◐</button>
          <button class="primary" id="quickRunBtn">✦ 启动下一步</button>
        </div>
      </header>

      <div class="content" id="content"></div>
    </main>
  </div>

  <dialog id="projectDialog">
    <form method="dialog" id="projectForm">
      <div class="dialog-head"><div><p class="eyebrow">NEW PROJECT</p><h2>建立制作项目</h2></div><button value="cancel" class="close">×</button></div>
      <label>项目名称<input name="name" required maxlength="40" placeholder="例如：雨夜来信" /></label>
      <div class="form-grid">
        <label>画幅<select name="ratio"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:3</option></select></label>
        <label>目标时长<select name="duration"><option value="30">30 秒</option><option value="15">15 秒</option><option value="60">60 秒</option><option value="90">90 秒</option></select></label>
      </div>
      <label>创意简述<textarea name="brief" rows="5" required placeholder="一句话想法、剧情、风格、参考方向……"></textarea></label>
      <label>目标生成器<select name="generator"><option>Seedance 2.0</option><option>Veo 3.1</option><option>Runway</option><option>Kling</option><option>Adobe Firefly</option><option>待定 / 多模型</option></select></label>
      <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="default" class="primary">创建并进入流程</button></div>
    </form>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">PREFERENCES</p><h2>工作台设置</h2></div><button value="cancel" class="close">×</button></div>
      <label>默认导出语言<select id="languageSetting"><option>中文</option><option>中英双语</option><option>English</option></select></label>
      <label>资产批准规则<select id="approvalSetting"><option>严格：A 级必须文件 + QA</option><option>灵活：允许临时参考</option></select></label>
      <label class="toggle-row"><span><strong>自动保存</strong><small>修改后写入浏览器本地存储</small></span><input id="autosaveSetting" type="checkbox" checked /></label>
      <div class="dialog-actions"><button value="default" class="primary">完成</button></div>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
